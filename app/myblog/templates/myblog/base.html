<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>MyBlog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif; margin:0}
    header{padding:16px 24px; border-bottom:1px solid #eee; font-weight:600}
    main{padding:24px; max-width:900px; margin:0 auto}
    .grid{display:grid; gap:16px}
    .card{border:1px solid #eee; border-radius:12px; padding:16px}
    .muted{color:#666; font-size:14px}
    a{color:#0b5ed7; text-decoration:none}
    nav a{margin-right:12px}
    .pill{display:inline-block; border:1px solid #ddd; padding:2px 8px; border-radius:999px; font-size:12px; margin-right:6px}
  </style>
</head>
<body>
<header>
  <nav>
    <a href="/myblog/">Головна</a>
    <a href="/myblog/articles/">Статті</a>
    <a href="/admin/">Адмінка</a>
    <a href="/myblog/categories/">Категорії</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
